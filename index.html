<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Comprobación de Vuelo - MSFS 2024</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #141b2d;
            --border-color: #1f2a44;
            --accent-blue: #00d2ff;
            --accent-green: #00ff66;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .checklist-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-bottom: 2px solid var(--accent-blue);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-blue);
            margin: 0;
        }

        .aircraft-selector {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--accent-blue);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        .aircraft-selector option {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        .reset-btn {
            background-color: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background-color: var(--accent-blue);
            color: var(--bg-color);
        }

        /* TITULOS DE SECCION */
        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-blue);
            background-color: rgba(0, 210, 255, 0.05);
            padding: 8px 12px;
            border-left: 3px solid var(--accent-blue);
            margin-top: 20px;
            margin-bottom: 10px;
        }

        /* ELEMENTOS CON CHECKBOX */
        .checklist-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            user-select: none;
            transition: background 0.15s ease;
        }

        .checklist-item:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .checklist-item input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--text-muted);
            border-radius: 3px;
            margin-right: 14px;
            outline: none;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checklist-item input[type="checkbox"]:checked {
            border-color: var(--accent-green);
            background-color: rgba(0, 255, 102, 0.1);
        }

        .checklist-item input[type="checkbox"]:checked::after {
            content: "✓";
            color: var(--accent-green);
            font-weight: bold;
            font-size: 14px;
        }

        .checklist-item label {
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            flex-grow: 1;
        }

        .checklist-item input[type="checkbox"]:checked + label {
            color: var(--text-muted);
            text-decoration: line-through;
        }
    </style>
</head>

        let currentStepId = 1;

        // Cargar la checklist del avión seleccionado
        function renderChecklist(aircraftKey) {
            const aircraft = checklistsData[aircraftKey];
            const container = document.getElementById('checklist-content');
            document.getElementById('checklist-title').innerText = aircraft.title;
            
            container.innerHTML = '';
            currentStepId = 1;

            aircraft.sections.forEach(section => {
                // Crear el título de la sección
                const secTitle = document.createElement('div');
                secTitle.className = 'section-title';
                secTitle.innerText = section.title;
                container.appendChild(secTitle);

                // Crear los items de la sección
                section.items.forEach(itemText => {
                    const stepId = `step-${currentStepId++}`;
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'checklist-item';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.id = stepId;

                    const label = document.createElement('label');
                    label.htmlFor = stepId;
                    label.innerText = itemText;

                    itemDiv.appendChild(checkbox);
                    itemDiv.appendChild(label);

                    // Hacer que todo el contenedor ejecute el cambio del checkbox al hacer clic
                    itemDiv.addEventListener('click', (e) => {
                        if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL') {
                            checkbox.checked = !checkbox.checked;
                        }
                    });

                    container.appendChild(itemDiv);
                });
            });
        }

        function changeAircraft() {
            const selector = document.getElementById('aircraftSelect');
            renderChecklist(selector.value);
        }

        function resetChecklist() {
            const checkboxes = document.querySelectorAll('#checklist-content input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = false);
        }

        // Renderizado inicial
        renderChecklist('a320');
